[workspace]
resolver = "2"
members = [
    "crates/libtokenstick",
    "crates/tokenstick-server",
    "crates/tokenstick-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TokenStick/tokenstick-host"
rust-version = "1.80"

[workspace.dependencies]
libtokenstick = { path = "crates/libtokenstick" }
tokenstick-server = { path = "crates/tokenstick-server" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tokio-stream = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
